<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go – Fist Power-Speed Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{
  color-scheme: dark;
  --bg:#080c14; --panel:#111827; --panel2:#0b1220; --line:#1f2a3d; --ink:#f1f5f9; --text:#cbd5e1; --mute:#7b8aa3;
  --blue:#38bdf8; --red:#f87171; --amber:#fbbf24; --green:#4ade80; --purple:#c084fc;
  --mono:"JetBrains Mono",SFMono-Regular,Consolas,Menlo,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--text); font:14px/1.55 var(--sans);
  padding:20px 14px calc(28px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(900px 420px at 50% -120px,#13233d 0,transparent 70%),var(--bg);
}
.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
h1,h2,h3,p,ul,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Integrated Media Gallery Grid */
.media-gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.banner{position:relative;height:180px;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--panel2);transition:border-color .2s ease, transform .2s ease}
.banner:hover{border-color:var(--blue);transform:translateY(-2px)}
.banner img, .banner video{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;transition:transform .4s ease}
.banner:hover img, .banner:hover video{transform:scale(1.03)}
.banner::after{content:attr(data-label);position:absolute;right:10px;bottom:10px;font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(8,12,20,.8);color:var(--ink);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);pointer-events:none}

/* DEMO WIP Overlay Tag */
.wip-tag{position:absolute;top:10px;left:10px;font:700 10px var(--mono);color:var(--amber);background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4);padding:3px 8px;border-radius:6px;backdrop-filter:blur(6px);pointer-events:none;z-index:2;letter-spacing:.05em}

.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.name{font-size:2rem;line-height:1;font-weight:800;letter-spacing:.3em;color:var(--blue)}
.badge{font-size:12px;color:var(--blue);border:1px solid rgba(56,189,248,.5);background:rgba(56,189,248,.08);padding:4px 12px;border-radius:99px}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .2s}
details.wide{grid-column:1/-1}
details[open]{border-color:rgba(56,189,248,.45)}
summary{list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:700;color:var(--amber);min-height:48px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(-45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
summary:hover{background:rgba(255,255,255,.03)}
.body{padding:2px 14px 14px;border-top:1px dashed var(--line)}
.body h3{font-size:.85rem;color:var(--red);margin:12px 0 6px}
.body p{margin-top:10px}
.body ul{padding-left:18px;margin-bottom:4px}
.body li{margin-top:7px}
.body strong{color:var(--ink)}

/* Simulation */
.hud{display:flex;flex-direction:column;gap:16px}
.hud-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hud-head h2{font-size:1.15rem;color:var(--ink)}
.tag{font:11px var(--mono);color:var(--blue)}
.speed{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.speed-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600}
.speed-head output{font:700 1.3rem var(--mono);color:var(--blue)}

/* Custom Gradient Slider */
input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:8px;
  border-radius:99px;
  background:linear-gradient(90deg, var(--red) 0%, var(--amber) 50%, var(--green) 100%);
  cursor:pointer;
  margin:10px 0;
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--ink);
  border:2px solid var(--panel);
  box-shadow:0 0 8px rgba(0,0,0,0.5);
  cursor:pointer;
  transition:transform .15s ease;
}
input[type=range]::-webkit-slider-thumb:hover{
  transform:scale(1.15);
}
input[type=range]::-moz-range-thumb{
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--ink);
  border:2px solid var(--panel);
  box-shadow:0 0 8px rgba(0,0,0,0.5);
  cursor:pointer;
  transition:transform .15s ease;
}
input[type=range]::-moz-range-thumb:hover{
  transform:scale(1.15);
}

.range-ends{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mute)}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.view{position:relative;height:320px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#050811;cursor:grab}
.view:active{cursor:grabbing}
#sim3d,#sim3d canvas{width:100%;height:100%;display:block}
.metrics{display:flex;flex-direction:column;gap:8px}
.metric{--c:var(--blue);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;cursor:pointer;user-select:none;transition:background .15s,border-color .15s}
.metric:hover{background:#142036}
.metric.selected{background:color-mix(in srgb,var(--c) 14%,var(--panel2));border-color:var(--c)}
.metric[data-stat=temp]{--c:var(--purple)} .metric[data-stat=strain]{--c:var(--amber)} .metric[data-stat=force]{--c:var(--red)}
.metric dt{font-size:12px;color:var(--mute)}
.metric.selected dt{color:var(--ink)}
.metric dd{font:700 .85rem var(--mono);color:var(--ink);text-align:right}
.metric[data-stat=force] dd{color:var(--red);font-size:1rem}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:11px 14px;font-size:13px}

/* Stage meter */
.stage{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stage-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px;color:var(--mute)}
.stage-top b{color:var(--red);font:700 12px var(--mono)}
.bar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:10px}
.bar i{height:8px;border-radius:3px;background:#1a2538;transition:background .25s}
.bar i.on{background:linear-gradient(90deg,var(--amber),var(--red))}
.stage-name{font-weight:700;color:var(--ink)}
.stage-text{font-size:13px}

.graph{background:#050811;border:1px solid var(--line);border-radius:12px;padding:12px}
.graph-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px}
#curve{width:100%;height:170px;display:block}

/* Theater Mode Modal */
.modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(5,8,17,.95);backdrop-filter:blur(12px);justify-content:center;align-items:center;padding:20px;cursor:zoom-out}
.modal.active{display:flex}
.modal-content-wrapper{position:relative;max-width:92vw;max-height:88vh;display:flex;justify-content:center;align-items:center}
.modal img, .modal video{max-width:92vw;max-height:88vh;border-radius:12px;border:1px solid var(--blue);box-shadow:0 0 40px rgba(56,189,248,.25);object-fit:contain}
.modal-close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:20px;font-size:28px;color:var(--ink);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border-radius:50%;border:1px solid rgba(255,255,255,.15)}

@media(max-width:720px){
  body{padding:12px 10px calc(24px + env(safe-area-inset-bottom,0px))}
  .card{padding:14px;border-radius:14px}
  .media-gallery{grid-template-columns:1fr;gap:10px}
  .banner{height:150px}
  .name{font-size:1.6rem}
  .sections,.grid{grid-template-columns:1fr}
  .view{height:260px}
  .metrics{display:grid;grid-template-columns:1fr 1fr}
  .metric{flex-direction:column;align-items:flex-start;gap:2px}
  .metric dd{text-align:left}
  .graph-head{flex-direction:column;gap:2px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <section class="card">
    <div class="media-gallery">
      <!-- PHOTO BANNER -->
      <div class="banner" id="photoBannerBtn" role="button" tabindex="0" aria-label="Expand photo banner" data-label="🔍 Photo Artwork">
        <img src="https://i.imgur.com/59hhbSm.png" alt="Go character photo banner">
      </div>
      <!-- VIDEO ANIMATION BANNER WITH DEMO WIP -->
      <div class="banner" id="videoBannerBtn" role="button" tabindex="0" aria-label="Expand video banner theater mode" data-label="🎬 Animation Demo">
        <span class="wip-tag">⚠️ DEMO WIP</span>
        <video src="https://i.imgur.com/bgxgvLS.mp4" autoplay loop muted playsinline poster="https://i.imgur.com/59hhbSm.png"></video>
      </div>
    </div>

    <div class="title-row">
      <h1 class="name">GO</h1>
      <span class="badge">Duelist application file</span>
    </div>
    <div class="sections" id="sections"></div>
  </section>

  <main class="card hud">
    <div class="hud-head"><h2>Fist power-speed simulation</h2><span class="tag">MODEL // GO_01</span></div>

    <div class="speed">
      <div class="speed-head"><label for="vSlider">Swing speed</label><output id="vVal"></output></div>
      <input type="range" id="vSlider" min="0.1" max="16" step="0.1" value="16">
      <div class="range-ends"><span>0.1 m/s · slow, heavy</span><span>16 m/s · fast, light</span></div>
    </div>

    <div class="grid">
      <div class="view"><div id="sim3d"></div></div>
      <dl class="metrics" id="metrics"></dl>
    </div>

    <div class="note" id="statDescBox"><strong id="statDescTitle"></strong> <span id="statDescText"></span></div>

    <div class="stage">
      <div class="stage-top"><span>Impact scale</span><b id="stageNo"></b></div>
      <div class="bar" id="stageBar"></div>
      <div><span class="stage-name" id="stageName"></span> <span class="stage-text" id="stageText"></span></div>
    </div>

    <div class="graph">
      <div class="graph-head"><span>Statistic curves · tap a stat to highlight</span><span id="activeStatLabel"></span></div>
      <canvas id="curve"></canvas>
    </div>
  </main>
</div>

<!-- Theater Mode Modal -->
<div class="modal" id="theaterModal">
  <div class="modal-close" id="modalCloseBtn">&times;</div>
  <div class="modal-content-wrapper" id="modalContentWrapper"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ───────── Profile content (data-driven) ─────────
  const li = (t, d) => `<li><strong>${t}:</strong> ${d}</li>`;
  const DOC = [
    ['💥', 'Powers & weapons', 'wide', `
      <h3>Gravity Fist (Passive)</h3>
      <p>Go creates a localized gravitational force field ahead of his fist whenever he swings a punch.</p>
      <ul>${li('Slower Punch = Bigger Boom', 'The slower and wider he swings, the more time his gravitational field has to continuously pressurize and crush surrounding air molecules together.')}
      ${li('Explosive Release', 'The second his fist hits a target, all that trapped, super-pressurized air collapses instantly and releases externally in a massive explosion.')}
      ${li('Heavy Resistance', 'Pressurizing all that air creates heavy resistance, making his fist feel super heavy to swing.')}</ul>
      <h3>Combat Techniques</h3>
      <ul>${li('Quick Jab', "Very fast punch, so there's no time to build up heavy air pressure. Delivers a quick, sharp, stingy pain to the enemy.")}
      ${li('Big Swing', 'A big, slow winding swing that heavily pressurizes a massive pocket of air. Hits like a truck and causes a massive explosion.')}
      ${li('Hydrogen Fist (Theoretical)', 'Never done before, but if he swings slow enough with enough power, his gravity field could pressurize the air hard enough to trigger a mini nuclear explosion.')}</ul>`],
    ['⚔️', 'Strengths', '', `<ul>
      ${li('Brawler / Infighter', "Loves getting right in the enemy's face and beating them up close.")}
      ${li('Tanky', 'Takes hits well so he can walk right up to enemies and land his punches.')}
      ${li('Nimble Feet', 'Has super strong legs that let him dodge easily and move fast despite his heavy punches.')}</ul>`],
    ['🛡️', 'Weaknesses', '', `<ul>
      ${li('No Ranged Attacks', "Can't do anything against enemies who stay far away and shoot from distance.")}
      ${li('Blast Recoil', "The explosions affect him too. He has to plant his feet hard so he doesn't get blown back, which tires him out fast.")}
      ${li('Tunnel Vision', 'When he gets in close, he only focuses on what\'s right in front of him and loses sight of his sides.')}</ul>`],
    ['👤', 'Origin & lore', 'wide', `
      <p><strong>Power origin:</strong> Go's raw love for brawling is so intense that his stance and focus trigger a strange bio-electric reaction in his nervous system. When he winds up a punch with pure intent, his body creates a natural gravity field ahead of his fist—pressurizing air purely through his raw willpower and natural combat instinct.</p>
      <p><strong>Personality:</strong> A simple, straightforward guy. He doesn't care about the science or why his hands bend physics. If it lets him punch harder, he's happy with it!</p>`]
  ];
  $('sections').innerHTML = DOC.map(([i, t, c, b]) => `<details class="${c}"><summary>${i} ${t}</summary><div class="body">${b}</div></details>`).join('');

  // ───────── Stats, tiers, descriptions ─────────
  const STATS = {
    weight: { title: 'Effective weight', color: '--blue', label: 'EFFECTIVE WEIGHT [G]', id: 'wVal',
      text: "Apparent mass of Go's fist during swing, escalating exponentially as localized gravity pressurizes surrounding matter." },
    temp: { title: 'Compression temp', color: '--purple', label: 'COMPRESSION TEMP [°C]', id: 'tempVal',
      text: 'Peak thermodynamic temperature generated by extreme atmospheric molecule pressurization ahead of the strike.' },
    strain: { title: 'Tidal strain', color: '--amber', label: 'TIDAL STRAIN [%]', id: 'sVal',
      text: "Structural and physical strain exerted on Go's body caused by the opposing gravitational pull and accumulated fist weight." },
    force: { title: 'Peak impact force', color: '--red', label: 'PEAK IMPACT FORCE [MN]', id: 'fVal',
      text: 'Total kinetic and explosive force delivered directly to the target upon contact.' }
  };
  $('metrics').innerHTML = Object.entries(STATS).map(([k, s]) => `<div class="metric" data-stat="${k}" role="button" tabindex="0"><dt>${s.label.replace(/ \[.*/, '')}</dt><dd id="${s.id}"></dd></div>`).join('');
  $('stageBar').innerHTML = '<i></i>'.repeat(8);

  const TIERS = [
    [14.0, 'Stage 1 — Light Sparring Jab: Safe velocity. Zero recoil or structural strain.'],
    [11.0, 'Stage 2 — Heavy Boxing Punch: Shatters jawbones and causes severe concussive recoil.'],
    [8.0,  'Stage 3 — Vehicle Collision Level: Equivalent to a 60 km/h car crash. Demolishes brick walls.'],
    [5.0,  'Stage 4 — Freight Train Impact: Sufficient kinetic force to crush reinforced concrete barriers.'],
    [3.0,  'Stage 5 — Bunker Buster Shell: Tremendous shockwave. Collapses underground concrete fortifications.'],
    [1.5,  "Stage 6 — Seismic Shockwave: Demolishes multi-story buildings; extreme tidal strain on Go's joints."],
    [0.5,  'Stage 7 — Meteorite Impact: Creates massive surface craters; extreme air displacement & localized heating.'],
    [0.0,  'Stage 8 — Core Fusion Ignition: Micro-blackhole gravitational field. Triggers plasma nuclear fusion.']
  ];

  const vSlider = $('vSlider'), host = $('sim3d'), canvas =$('curve'), ctx = canvas.getContext('2d');

  // ───────── Theater Mode Modal Logic ─────────
  const modal = $('theaterModal'), wrapper = $('modalContentWrapper'), closeBtn =$('modalCloseBtn');
  
  const openTheater = (type, src) => {
    wrapper.innerHTML = '';
    if (type === 'image') {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Go character expanded artwork';
      wrapper.appendChild(img);
    } else if (type === 'video') {
      const vid = document.createElement('video');
      vid.src = src;
      vid.controls = true;
      vid.autoplay = true;
      vid.playsInline = true;
      wrapper.appendChild(vid);
    }
    modal.classList.add('active');
  };

  const closeTheater = () => {
    modal.classList.remove('active');
    wrapper.innerHTML = '';
  };

  $('photoBannerBtn').addEventListener('click', () => openTheater('image', 'https://i.imgur.com/59hhbSm.png'));$('videoBannerBtn').addEventListener('click', () => openTheater('video', 'https://i.imgur.com/bgxgvLS.mp4'));
  closeBtn.addEventListener('click', closeTheater);
  modal.addEventListener('click', e => { if (e.target === modal) closeTheater(); });
  addEventListener('keydown', e => e.key === 'Escape' && closeTheater());

  const V_MIN = 0.1, V_MAX = 16, SPAN = 15.9, MASS = 4;
  const slow = (v, p) => Math.pow(Math.max(0, (V_MAX - v) / SPAN), p);
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let activeStat = 'force';

  // ───────── Scene ─────────
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050811);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(0.6, 1.5, 6.4);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(DPR);
  host.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, minDistance: 2.5, maxDistance: 12,
                            maxPolarAngle: Math.PI / 2 - 0.02, target: new THREE.Vector3(0, -0.2, 0) });

  scene.add(new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(3, 5, 4); scene.add(sun);

  // ───────── 3D 1-Meter Distance Ruler ─────────
  const FLOOR = -0.9, START = -2.4, PATH = 4.0, IMPACT = START + PATH; // 4 scene units = 1 m
  const grid = new THREE.GridHelper(10, 20, 0x1e293b, 0x0f172a); grid.position.y = FLOOR; scene.add(grid);

  function label(text, x, y, z, size = 0.28, color = '#64748b') {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const g = c.getContext('2d'); g.font = '600 32px Monospace'; g.fillStyle = color;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 256, 64);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
    s.scale.set(size * 4, size, 1); s.position.set(x, y, z); scene.add(s);
  }
  const AX_Z = 1.1, tickPts = [START, FLOOR, AX_Z, IMPACT, FLOOR, AX_Z];
  for (let d = 0; d <= 1.001; d += 0.25) {
    const sx = START + d * PATH;
    tickPts.push(sx, FLOOR, AX_Z, sx, FLOOR, AX_Z + 0.12);
    label(d.toFixed(2) + 'm', sx, FLOOR, AX_Z + 0.32, 0.2);
  }
  const axGeo = new THREE.BufferGeometry(); axGeo.setAttribute('position', new THREE.Float32BufferAttribute(tickPts, 3));
  scene.add(new THREE.LineSegments(axGeo, new THREE.LineBasicMaterial({ color: 0x334155 })));
  label('1.00m Travel Distance', 0, FLOOR, AX_Z + 0.65, 0.22, '#38bdf8');

  // ───────── Target Plate ─────────
  const ROWS = 6, COLS = 6, N = ROWS * COLS, BH = 1.6 / ROWS, BD = 1.6 / COLS, WALL_X = 2.0;
  const wall = new THREE.InstancedMesh(new THREE.BoxGeometry(0.12, BH * 0.95, BD * 0.95),
                                       new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.1 }), N);
  wall.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(wall);

  const cell = [], prof = new Float32Array(N), dummy = new THREE.Object3D(), tmp = new THREE.Color();
  const debrisVel = [];

  for (let r = 0, i = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++, i++) {
    const y = (r - ROWS / 2 + 0.5) * BH, z = (c - COLS / 2 + 0.5) * BD;
    cell.push([y, z]);
    const p = Math.exp(-(y * y + z * z) / 0.5); prof[i] = p;

    debrisVel.push({
      vx: (0.8 + Math.random() * 1.5) * (0.3 + p * 1.5),
      vy: (Math.random() - 0.5) * 1.2 * (0.2 + p),
      vz: (Math.random() - 0.5) * 1.2 * (0.2 + p),
      rx: (Math.random() - 0.5) * 8, ry: (Math.random() - 0.5) * 8, rz: (Math.random() - 0.5) * 8
    });
  }

  const STOPS = [[0.17, 0.23, 0.56], [0.17, 0.56, 0.66], [0.31, 0.69, 0.43], [0.9, 0.76, 0.21], [0.75, 0.22, 0.17]];
  function colormap(t, out) {
    const f = Math.min(1, Math.max(0, t)) * (STOPS.length - 1), i = Math.min(STOPS.length - 2, f | 0), u = f - i, a = STOPS[i], b = STOPS[i + 1];
    return out.setRGB(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u);
  }

  function paintWall(load, stress) {
    const destructFactor = Math.max(0, (stress - 0.1) / 0.9);

    for (let i = 0; i < N; i++) {
      const scatterAmount = load * destructFactor;
      const bendAmount = load * (1 - destructFactor) * (0.05 + stress * 0.25) * prof[i];

      dummy.position.set(
        WALL_X + bendAmount + scatterAmount * debrisVel[i].vx,
        cell[i][0] + scatterAmount * debrisVel[i].vy,
        cell[i][1] + scatterAmount * debrisVel[i].vz
      );
      dummy.rotation.set(
        scatterAmount * debrisVel[i].rx,
        scatterAmount * debrisVel[i].ry,
        scatterAmount * debrisVel[i].rz
      );
      dummy.updateMatrix();
      wall.setMatrixAt(i, dummy.matrix);
      wall.setColorAt(i, colormap(load * (0.08 + 0.92 * stress) * prof[i] + (1 - load) * stress * prof[i], tmp).lerp(tmp.clone().set(0x1e293b), 1 - Math.min(1, Math.max(load, stress))));
    }
    wall.instanceMatrix.needsUpdate = true;
    wall.instanceColor.needsUpdate = true;
  }

  // Fist Group
  const fist = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.4, metalness: 0.5 });
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.6, 24).rotateZ(Math.PI / 2), steel); arm.position.x = -0.8; fist.add(arm);
  fist.add(new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.55, 0.55), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3, metalness: 0.5 })));
  const fieldMat = new THREE.MeshBasicMaterial({ color: 0xf87171, transparent: true, opacity: 0, depthWrite: false });
  const field = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 24), fieldMat); fist.add(field);
  scene.add(fist);

  const velArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0x38bdf8, 0.18, 0.1);
  const forceArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(WALL_X + 0.1, 0, 0), 1, 0xf87171, 0.22, 0.12);
  forceArrow.visible = false; scene.add(velArrow, forceArrow);

  // Loop
  const HOLD = 1.6, RAMP = 0.25;
  let x = START, hold = 0, last = null, visible = true, stress = 0, fieldOpacity = 0;

  new IntersectionObserver(e => { visible = e[0].isIntersecting; if (visible) last = null; }).observe(host);

  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    if (w && h) { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (cw && ch) { canvas.width = cw * DPR; canvas.height = ch * DPR; drawGraph(); }
  }
  new ResizeObserver(resize).observe(host); new ResizeObserver(resize).observe(canvas);

  function reset() { hold = 0; x = START; forceArrow.visible = false; paintWall(0, stress); }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!visible) return;
    const dt = last == null ? 0 : Math.min((ts - last) / 1000, 0.05); last = ts;
    const v = parseFloat(vSlider.value);

    if (hold <= 0) {
      x = Math.min(IMPACT - 0.4, x + (PATH * v) * dt);
      if (x >= IMPACT - 0.4) { hold = HOLD; forceArrow.visible = true; }
    } else {
      hold -= dt;
      paintWall(Math.min(1, (HOLD - hold) / RAMP), stress);
      if (hold <= 0) reset();
    }
    fist.position.x = x;
    field.material.opacity += (fieldOpacity - field.material.opacity) * Math.min(1, dt * 8);

    const L = 0.35 + (v / V_MAX) * 1.3;
    velArrow.position.set(x + 0.4, 0.62, 0); velArrow.setLength(L, 0.18, 0.1);

    controls.update();
    renderer.render(scene, camera);
  }

  // ───────── Multi-Curve Graph ─────────
  function getCurveVal(stat, v) {
    if (stat === 'force') return slow(v, 2.5);
    if (stat === 'weight' || stat === 'strain') return slow(v, 2.2);
    if (v >= 7.0) return Math.pow((16 - v) / 9, 2) * 0.1; // temp
    return 0.1 + Math.min(0.9, (7.0 - v) / 6.9);
  }

  function drawGraph() {
    const w = canvas.width, h = canvas.height, d = DPR, L = 40 * d, R = 15 * d, T = 15 * d, B = 25 * d;
    if (!w || !h) return;
    const v = parseFloat(vSlider.value), px = f => L + f * (w - L - R), py = f => h - B - f * (h - T - B);
    ctx.clearRect(0, 0, w, h);
    ctx.font = `${9 * d}px Monospace`; ctx.lineWidth = d;

    for (let i = 0; i <= 4; i++) {
      const f = i / 4, y = py(f), xx = px(f);
      ctx.strokeStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - R, y); ctx.moveTo(xx, T); ctx.lineTo(xx, h - B); ctx.stroke();
      ctx.fillStyle = '#64748b'; ctx.textAlign = 'right'; ctx.fillText((f * 100).toFixed(0) + '%', L - 6 * d, y + 3 * d);
      ctx.textAlign = 'center'; ctx.fillText((V_MIN + f * SPAN).toFixed(0) + 'm/s', xx, h - B + 14 * d);
    }

    // Inactive curves first, active (highlighted) curve last
    const ids = Object.keys(STATS).filter(k => k !== activeStat).concat(activeStat);
    ids.forEach(id => {
      const on = id === activeStat, col = css(STATS[id].color);
      ctx.save();
      ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip();
      ctx.lineWidth = (on ? 2.5 : 1) * d; ctx.strokeStyle = col; ctx.globalAlpha = on ? 1 : 0.25;
      const path = new Path2D();
      for (let i = 0; i <= 100; i++) {
        const xPos = px(i / 100), yPos = py(getCurveVal(id, V_MIN + (i / 100) * SPAN));
        i ? path.lineTo(xPos, yPos) : path.moveTo(xPos, yPos);
      }
      ctx.stroke(path);
      ctx.restore();
      if (on) { // current-speed marker
        ctx.fillStyle = '#050811'; ctx.strokeStyle = col; ctx.lineWidth = 2.5 * d;
        ctx.beginPath(); ctx.arc(px((v - V_MIN) / SPAN), py(getCurveVal(id, v)), 4.5 * d, 0, 7); ctx.fill(); ctx.stroke();
      }
    });
  }

  // Stat selection
  function selectStat(k) {
    activeStat = k;
    const s = STATS[k], col = css(s.color);
    document.querySelectorAll('.metric').forEach(r => r.classList.toggle('selected', r.dataset.stat === k));
    $('activeStatLabel').textContent = `Focus: ${s.title}`; $('activeStatLabel').style.color = col;
    $('statDescTitle').textContent = `${s.title}:`; $('statDescTitle').style.color = col;
    $('statDescText').textContent = s.text; $('statDescBox').style.borderLeftColor = col;
    drawGraph();
  }
  document.querySelectorAll('.metric').forEach(r => {
    r.addEventListener('click', () => selectStat(r.dataset.stat));
    r.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), selectStat(r.dataset.stat)));
  });

  // Update stats
  const fmt = n => n.toLocaleString('en-US');
  function update() {
    const v = parseFloat(vSlider.value);
    const g = Math.max(1, Math.round(1 + 499 * slow(v, 2.2)));
    const strain = Math.round(g / 5);
    const F = 3200 + (10500000 - 3200) * slow(v, 2.5);

    const tempC = v >= 7.0 ? Math.round(25 + 75 * Math.pow((16 - v) / 9, 2))
                           : Math.round(100 * Math.pow(10, (7.0 - v) * (5.176 / 6.9)));
    const formatTemp = t => t >= 1e6 ? `~${(t / 1e6).toFixed(1)}M °C` : t >= 1e3 ? `~${fmt(t)} °C` : `~${t} °C`;

    $('vVal').textContent = v.toFixed(1) + ' m/s';$('wVal').textContent = fmt(MASS * g) + ' kg (' + fmt(g) + ' G)';
    $('tempVal').textContent = formatTemp(tempC);$('fVal').textContent = F >= 1e6 ? (F / 1e6).toFixed(2) + ' MN' : (F / 1e3).toFixed(1) + ' kN';

    const [lab, col] = strain >= 75 ? ['CRITICAL', css('--red')] : strain >= 35 ? ['HIGH STRAIN', css('--amber')] : ['SAFE', css('--green')];
    $('sVal').textContent = `${strain}% [${lab}]`; $('sVal').style.color = col;

    const idx = TIERS.findIndex(t => v >= t[0]), [head, body] = TIERS[idx][1].split(': ');
    $('stageNo').textContent = `Stage ${idx + 1} of ${TIERS.length}`;
    $('stageName').textContent = head.replace(/^Stage \d+ — /, '') + ':';$('stageText').textContent = body;
    [...$('stageBar').children].forEach((b, i) => b.classList.toggle('on', i <= idx));

    stress = slow(v, 2.5);
    fieldOpacity = Math.min(1, g / 500) * 0.28;
    forceArrow.setLength(0.4 + Math.sqrt(F / 10.5e6) * 1.4, 0.22, 0.12);
    drawGraph();
  }

  vSlider.addEventListener('input', () => { update(); if (hold <= 0) reset(); });

  selectStat('force'); reset(); update(); resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
